name: PR Commit Message Linting

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Get Commit Messages
        run: |
          git fetch --unshallow || true
          git log --format='%s' origin/${{ github.event.pull_request.head.ref }} ^origin/${{ github.event.pull_request.base.ref }} > commit-messages.txt
          echo "Commit messages:"
          cat commit-messages.txt

      - name: Run Commitlint
        run: |
          while IFS= read -r commit; do
            echo "$commit" | npx commitlint || exit 1
          done < commit-messages.txt
